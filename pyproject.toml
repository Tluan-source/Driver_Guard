[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "driverguard"
version = "0.1.0"
description = "On-device driver monitoring (drowsiness + distraction) — metadata-only, deterministic risk engine"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "numpy>=1.26",
    "opencv-python>=4.9",
    "mediapipe>=0.10.14",
    "pyyaml>=6.0",
    "pydantic>=2.6",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]
eval = ["pandas>=2.1", "pyarrow>=15", "scikit-learn>=1.4", "matplotlib>=3.8"]
train = ["torch>=2.2", "scipy>=1.11", "scikit-learn>=1.4", "pandas>=2.1", "mne>=1.6", "requests>=2.32"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.4"]

[project.scripts]
driverguard = "driverguard.cli:main"
driverguard-model = "driverguard.learning.cli:main"

[tool.setuptools.packages.find]
include = ["driverguard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"
